name: NIGHTSHIFT Final Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Locate project
        run: |
          PROJECT=$(find . -name "ThreeOneOSFive.xcodeproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "::error::ThreeOneOSFive.xcodeproj tidak ditemukan"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Found: $PROJECT"

      - name: Build Release
        run: |
          set -o pipefail

          rm -rf build
          mkdir -p build

          xcodebuild \
            -project "$PROJECT" \
            -scheme "3105" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Locate built app
        run: |
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos \
            -maxdepth 1 \
            -name "*.app" \
            -print \
            -quit)

          if [ -z "$APP" ]; then
            echo "::error::File .app tidak ditemukan"
            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "Built app: $APP"

      - name: Package unsigned IPA
        run: |
          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R "$APP" build/Payload/

          cd build
          zip -r NIGHTSHIFT-3105-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NIGHTSHIFT-3105-unsigned
          path: build/NIGHTSHIFT-3105-unsigned.ipa
          if-no-files-found: error

      - name: Upload APP artifact
        uses: actions/upload-artifact@v4
        with:
          name: NIGHTSHIFT-3105-APP
          path: ${{ env.APP }}
          if-no-files-found: error
