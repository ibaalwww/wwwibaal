name: NIGHTSHIFT Build Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Locate project
        run: |
          find . -name "ThreeOneOSFive.xcodeproj" -print

      - name: Build with full compiler diagnostics
        shell: bash
        run: |
          set -o pipefail

          PROJECT=$(find . -name "ThreeOneOSFive.xcodeproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "::error::ThreeOneOSFive.xcodeproj tidak ditemukan"
            exit 1
          fi

          echo "PROJECT=$PROJECT"

          mkdir -p build

          xcodebuild \
            -project "$PROJECT" \
            -scheme "3105" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_SUPPRESS_WARNINGS=NO \
            clean build \
            2>&1 | tee build/xcodebuild.log

      - name: Show compiler errors
        if: failure()
        run: |
          echo "===== COMPILER ERRORS ====="
          grep -n -E "error:|fatal error:" build/xcodebuild.log || true

          echo "===== LAST 200 LINES ====="
          tail -n 200 build/xcodebuild.log

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NIGHTSHIFT-xcode-diagnostic
          path: build/xcodebuild.log
